[project]
name = "arcology-engineering"
version = "0.1.0"
description = "Reproducible Arcology concept geometry, resource scenarios and CAD exports"
requires-python = ">=3.12,<3.13"
dependencies = [
  "shapely==2.1.2",
  "numpy==2.5.3",
  "matplotlib==3.11.2",
  "trimesh==5.1.0",
  "ezdxf==1.4.4",
  "mapbox-earcut==2.1.0",
  "plotly==7.1.0",
  "reportlab==4.4.9",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
